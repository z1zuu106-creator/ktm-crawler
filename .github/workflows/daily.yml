name: 요금제 일간 크롤링

on:
  schedule:
    - cron: '30 0 * * *'  # 매일 UTC 00:30 (한국시간 09:30)
    - cron: '0 6 * * *'   # 매일 UTC 06:00 (한국시간 15:00)
    - cron: '0 8 * * *'   # 매일 UTC 08:00 (한국시간 17:00)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # output/ 결과 파일 커밋·푸시에 필요

jobs:
  crawl:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 크롤링 + 리포트 생성
        timeout-minutes: 30
        run: npm run daily
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO:  ${{ secrets.EMAIL_TO }}

      - name: 결과 파일 커밋
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 토큰을 remote URL에 직접 주입 (컨테이너 환경 인증 문제 우회)
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          # JSON 데이터만 커밋 (Excel 제외)
          git add output/history/ output/new_plans_registry.json output/report_meta.json || true
          git diff --cached --quiet || git commit -m "chore: 요금제 데이터 업데이트 $(date +'%Y-%m-%d')"
          git push origin HEAD:main
